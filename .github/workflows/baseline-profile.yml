name: Baseline profile

run-name: ${{ github.actor }} requested a baseline profile

# Manual only. Generation drives an emulator through the whole demo journey, which costs minutes,
# and the profile only needs regenerating when that journey or the code it walks changes.
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate and open a pull request
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Drop managed devices left by earlier runs
        run: ./gradlew cleanManagedDevices --unused-only

      # Both consumers. `:crayfish` gets the profile filtered down to the library, which is what
      # ships inside the AAR and what a consumer actually benefits from; `:androidApp` gets the
      # whole demo's, which is what the benchmarks measure against.
      #
      # -Pcrayfish.managedDevice picks the managed device over a connected one. There is no phone
      # plugged into a hosted runner, and without it the run would look for one and find nothing.
      - name: Generate
        run: |
          ./gradlew --stacktrace \
              :crayfish:generateBaselineProfile :androidApp:generateBaselineProfile \
              -Pcrayfish.managedDevice \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
              -Dorg.gradle.workers.max=4

      # The gate that says the AAR's profile holds only this library's classes. The journey runs
      # inside the demo, whose package sits under the library's, so a filter that drifts sweeps
      # demo classes into what every consumer downloads.
      - name: Check the generated profile
        run: ./gradlew :crayfish:assemble :crayfish:verifyBaselineProfile

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Generate baseline profiles"
          title: "Generate baseline profiles"
          body: |
            Regenerated by the `Baseline profile` workflow.

            Worth a look before merging: the rule count, and that nothing outside
            `com.github.skydoves.crayfish` appears in the library's profile. `verifyBaselineProfile`
            checks the second of those and has already run.
          delete-branch: true
          reviewers: skydoves
          branch: actions/baseline-profiles
